<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VONGOLA 手套 · 实时叠加</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="fire-canvas"></canvas>
    <canvas id="gl-canvas"></canvas>
  </div>

  <div id="status">正在启动…</div>
  <div id="rec-badge" hidden>● REC</div>
  <div id="gesture-debug" hidden></div>
  <div id="protocol-overlay" hidden>
    <div id="protocol-count"></div>
    <div id="protocol-task"></div>
    <div id="protocol-hint"></div>
  </div>
  <div id="result-panel" hidden></div>
  <div id="left-stack">
    <div id="tremor-panel">
      <div id="tremor-head">手部颤抖 · 掌心平移</div>
      <div class="signal-row">
        <div class="signal-row-head">
          <span class="signal-side">左手</span>
          <span class="signal-stats" id="tremor-left-stats">—</span>
        </div>
        <canvas id="tremor-left" width="560" height="104"></canvas>
      </div>
      <div class="signal-row">
        <div class="signal-row-head">
          <span class="signal-side">右手</span>
          <span class="signal-stats" id="tremor-right-stats">—</span>
        </div>
        <canvas id="tremor-right" width="560" height="104"></canvas>
      </div>
      <div id="tremor-foot">纵轴自动 · 横实 / 纵淡 · RMS（手长）</div>
    </div>
    <div id="signal-panel" hidden>
      <div id="signal-head">信号检视 · <span id="signal-task">—</span></div>
      <div class="signal-row">
        <div class="signal-row-head">
          <span class="signal-side">左手</span>
          <span class="signal-stats" id="signal-left-stats">—</span>
        </div>
        <canvas id="signal-left" width="560" height="112"></canvas>
      </div>
      <div class="signal-row">
        <div class="signal-row-head">
          <span class="signal-side">右手</span>
          <span class="signal-stats" id="signal-right-stats">—</span>
        </div>
        <canvas id="signal-right" width="560" height="112"></canvas>
      </div>
      <div id="signal-foot">虚线 p5 / p95 · 橙带 = 幅度下限 · S 关闭</div>
    </div>
  </div>
  <div id="hint">握拳点亮 · 张手熄灭 · 支持双手</div>
  <div id="mode-switch" role="group" aria-label="特效模式">
    <button type="button" data-mode="glow">手套微光</button>
    <button type="button" data-mode="flame">球形火焰</button>
  </div>
  <div id="protocol-bar" role="group" aria-label="测量协议">
    <button type="button" data-protocol="free">自由</button>
    <button type="button" data-protocol="open_close">握拳张开</button>
    <button type="button" data-protocol="pronation_supination">旋前旋后</button>
    <button type="button" id="protocol-start" hidden>开始</button>
  </div>
  <button id="flip-btn" title="左右手镜像翻转">⇄</button>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
